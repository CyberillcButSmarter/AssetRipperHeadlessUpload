name: Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ${{ matrix.config.os }}

    strategy:
      matrix:
        config:
          - { name: win_x64, os: windows-latest, runtime: win-x64, executable: AssetRipper.GUI.Free.exe, archive: zip }
          - { name: win_arm64, os: windows-latest, runtime: win-arm64, executable: AssetRipper.GUI.Free.exe, archive: zip }
          - { name: linux_x64, os: ubuntu-22.04, runtime: linux-x64, executable: AssetRipper.GUI.Free, archive: tar }
          - { name: linux_arm64, os: ubuntu-22.04-arm, runtime: linux-arm64, executable: AssetRipper.GUI.Free, archive: tar }
          - { name: mac_x64, os: macos-14, runtime: osx-x64, executable: AssetRipper.GUI.Free, archive: tar }
          - { name: mac_arm64, os: macos-14, runtime: osx-arm64, executable: AssetRipper.GUI.Free, archive: tar }

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish -c Release -r ${{ matrix.config.runtime }}
        working-directory: ./Source/AssetRipper.GUI.Free/

      - name: Stamp compile time
        shell: bash
        run: date -u > ./Source/0Bins/AssetRipper.GUI.Free/Release/${{ matrix.config.runtime }}/publish/compile_time.txt

      - name: Create Archive (zip)
        if: ${{ matrix.config.archive == 'zip' }}
        shell: pwsh
        working-directory: ./Source/0Bins/AssetRipper.GUI.Free/Release/${{ matrix.config.runtime }}/publish
        run: |
          $items = @('${{ matrix.config.executable }}', 'compile_time.txt') +
            (Get-ChildItem -File -Path *.dll,*.so,*.dylib | ForEach-Object Name)
          Compress-Archive -Path $items -DestinationPath "AssetRipper_${{ matrix.config.name }}.zip" -Force

      - name: Create Archive (tar)
        if: ${{ matrix.config.archive == 'tar' }}
        shell: bash
        working-directory: ./Source/0Bins/AssetRipper.GUI.Free/Release/${{ matrix.config.runtime }}/publish
        run: tar cvJf "AssetRipper_${{ matrix.config.name }}.tar.xz" "${{ matrix.config.executable }}" compile_time.txt $(ls *.{dll,so,dylib} 2>/dev/null)

      - name: Upload build archive
        uses: actions/upload-artifact@v7
        with:
          name: AssetRipper_${{ matrix.config.name }}
          path: ./Source/0Bins/AssetRipper.GUI.Free/Release/${{ matrix.config.runtime }}/publish/AssetRipper_${{ matrix.config.name }}.*
          if-no-files-found: error

  # Publishes the per-platform archives to a single rolling "continuous" prerelease.
  # Runs on pushes to master and manual/dispatched runs, but NOT on pull requests
  # (PRs just build, they don't release).
  release:
    needs: publish
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create/update the release and its tag
    steps:
      - name: Download all build archives
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: AssetRipper_*
          merge-multiple: true

      - name: Publish rolling "continuous" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -R release-assets
          # This job doesn't check out the repo, so gh has no git context - pass -R.
          # Roll the single "continuous" tag forward to the freshly built commit:
          # delete the old release + tag, then recreate at this commit with new assets.
          gh release delete continuous -R "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create continuous release-assets/* \
            -R "$GITHUB_REPOSITORY" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Continuous build" \
            --notes "Automatically built from the latest master (${GITHUB_SHA}) at $(date -u '+%Y-%m-%d %H:%M:%S UTC')."
